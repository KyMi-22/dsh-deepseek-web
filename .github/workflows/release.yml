name: Release

# Tag-driven release: the tag must equal package.json's version. The workflow
# packs the plugin, writes a SHA-256 sidecar, and attaches both to a GitHub
# Release. The plugin's self-update reads that release and verifies the digest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify tag matches package version
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (pkg.version !== tag) {
              console.error(`package.json ${pkg.version} != tag ${tag}`);
              process.exit(1);
            }
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)) {
              console.error(`tag ${tag} is not a release version`);
              process.exit(1);
            }
          '

      - name: Verify tests
        run: |
          npm run check
          npm test

      - name: Pack and hash
        run: npm run release:pack

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="$(basename dist/*.tgz)"
          REPO="${GITHUB_REPOSITORY}"

          # gh release upload resolves a release through /releases/tags/<tag>,
          # which returns 404 for drafts. Use the releases API for a draft and
          # only publish after all assets and their digests are verified.
          RELEASE_ID="$(gh api "repos/${REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1)"
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID="$(gh api -X POST "repos/${REPO}/releases" \
              -f tag_name="$TAG" -f name="$TAG" \
              -F draft=true -F generate_release_notes=true --jq .id)"
          fi
          IS_DRAFT="$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq .draft)"
          if [ "$IS_DRAFT" = "true" ]; then
            for FILE in dist/*.tgz dist/*.tgz.sha256; do
              NAME="$(basename "$FILE")"
              EXISTING="$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name == \"${NAME}\") | .id" | head -n1)"
              if [ -n "$EXISTING" ]; then gh api -X DELETE "repos/${REPO}/releases/assets/${EXISTING}" >/dev/null; fi
              gh api -X POST "repos/${REPO}/releases/${RELEASE_ID}/assets?name=${NAME}" \
                -H "Content-Type: application/octet-stream" --input "$FILE" >/dev/null
            done
          else
            gh release upload "$TAG" dist/*.tgz dist/*.tgz.sha256 --clobber
          fi

          DIGEST="$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq ".assets[] | select(.name == \"${ASSET}\") | .digest")"
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "release asset ${ASSET} has no GitHub sha256 digest; self-update requires one" >&2
            exit 1
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=false >/dev/null
          fi
