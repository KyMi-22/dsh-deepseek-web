name: Release

# Tag-driven release: the tag must equal package.json's version. The workflow
# packs the plugin, writes a SHA-256 sidecar, and attaches both to a GitHub
# Release. The plugin's self-update reads that release and verifies the digest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify tag matches package version
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (pkg.version !== tag) {
              console.error(`package.json ${pkg.version} != tag ${tag}`);
              process.exit(1);
            }
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)) {
              console.error(`tag ${tag} is not a release version`);
              process.exit(1);
            }
          '

      - name: Verify tests
        run: |
          npm run check
          npm test

      - name: Pack and hash
        run: npm run release:pack

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.tgz dist/*.tgz.sha256 --clobber
